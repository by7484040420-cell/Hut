<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta id="app-viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var mode = window.localStorage.getItem('sarthiai_view_mode') || 'desktop';
          var screenW = Math.min(window.screen.width || window.innerWidth || 390, window.innerWidth || 9999);
          var meta = document.getElementById('app-viewport');
          if (meta && mode === 'desktop' && screenW > 0 && screenW < 1100) {
            var desktopWidth = 1200;
            var scale = Math.max(0.25, Math.min(1, screenW / desktopWidth));
            meta.setAttribute(
              'content',
              'width=' + desktopWidth + ', initial-scale=' + scale.toFixed(4) + ', minimum-scale=0.25, maximum-scale=3.0, viewport-fit=cover'
            );
          }
        } catch (e) {}
      })();
    </script>
    <title>SarthiAI — Autonomous AI Form-Filler, Live Web Agent & Mini Browser</title>
    <meta name="description" content="AI-powered personal autopilot with live internet access, smart auto-fill for jobs, court/block applications, PAN/Passport/DL forms, travel planning, and a built-in mini browser." />
    <meta property="og:title" content="SarthiAI — Autonomous AI Form-Filler, Live Web Agent & Mini Browser" />
    <meta property="og:description" content="AI-powered personal autopilot with live internet access, smart auto-fill for jobs, court/block applications, PAN/Passport/DL forms, travel planning, and a built-in mini browser." />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SarthiAI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F6F8FB] text-slate-900 antialiased selection:bg-sky-200 selection:text-slate-900">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

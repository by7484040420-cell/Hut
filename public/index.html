<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIPIN AI — Test All Portals</title>
<style>
  body { font-family: sans-serif; background: #F4F1EA; margin: 0; padding: 16px; }
  .header { background: #12172B; color: #fff; padding: 16px; border-radius: 12px; margin-bottom: 14px; }
  .header h1 { margin: 0; font-size: 17px; }
  .header p { margin: 4px 0 0; font-size: 11.5px; color: #ccc; }
  .install-box { background: #fff; border: 2px dashed #E8A93B; border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 14px; }
  .install-box a { display: inline-block; background: #E8A93B; color: #12172B; text-decoration: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: move; }
  .summary { display: flex; gap: 8px; margin-bottom: 14px; font-size: 12px; }
  .summary .box { flex: 1; background: #fff; border-radius: 10px; padding: 10px; text-align: center; }
  .summary .box b { display: block; font-size: 18px; }
  .cat-label { font-size: 11px; font-weight: 700; color: #999; margin: 14px 0 6px; text-transform: uppercase; }
  .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .name { font-size: 13px; font-weight: 600; }
  .card .status { font-size: 10px; color: #999; }
  .card .actions { display: flex; gap: 4px; flex-shrink: 0; }
  .card a.open { background: #12172B; color: #fff; text-decoration: none; padding: 5px 9px; border-radius: 14px; font-size: 10.5px; }
  .card button { border: none; padding: 5px 8px; border-radius: 14px; font-size: 13px; cursor: pointer; }
  .card button.yes { background: #E4F5EC; }
  .card button.no { background: #FCE8E6; }
  .marked-yes { border-left: 4px solid #2FA36B; }
  .marked-no { border-left: 4px solid #E2483D; }
</style>
</head>
<body>
  <div class="header">
    <h1>🇮🇳 BIPIN AI — Sab Portal Test Karo</h1>
    <p>Har portal khol kar bookmarklet try karo, phir yahan result mark karo</p>
  </div>

  <div class="install-box">
    <p style="font-size:12.5px;margin:0 0 8px;">Pehle yeh bookmarklet save karo:</p>
    <a id="bookmarkletLink" href="#" draggable="true" onclick="return false;">📌 BIPIN AI Bharo</a>
    <p style="font-size:10.5px;color:#999;margin:8px 0 0;">Mobile: <span id="copyLink" style="text-decoration:underline;cursor:pointer;">code copy karo</span></p>
  </div>

  <div class="summary" id="summary"></div>
  <div id="portalsList"></div>

  <script src="https://cdn.jsdelivr.net/npm/@capacitor/core@6/dist/index.js"></script>
  <script>
    const currentOrigin = window.location.origin;
    const bookmarkletCode = "javascript:(function(){var s=document.createElement('script');s.src='" + currentOrigin + "/bipin-autofill.js?t='+Date.now();document.body.appendChild(s);})();";
    document.getElementById('bookmarkletLink').href = bookmarkletCode;
    document.getElementById('copyLink').onclick = () => {
      navigator.clipboard.writeText(bookmarkletCode);
      document.getElementById('copyLink').textContent = '✅ Copy ho gaya!';
    };

    async function markTest(portalId, result) {
      await fetch('/api/mark-test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ portalId, result }),
      });
      loadPortals();
    }

    async function openInAppBrowser(url) {
      try {
        const { InAppBrowser } = Capacitor.Plugins;
        await InAppBrowser.openWebView({ url: url, title: 'BIPIN AI' });
      } catch (error) {
        console.error('InAppBrowser error:', error);
      }
    }

    async function loadPortals() {
      const portals = await (await fetch('/api/portals')).json();
      const list = document.getElementById('portalsList');
      list.innerHTML = '';

      const worked = portals.filter(p => p.testResult?.result === 'worked').length;
      const blocked = portals.filter(p => p.testResult?.result === 'blocked').length;
      const untested = portals.length - worked - blocked;
      document.getElementById('summary').innerHTML = `
        <div class="box"><b>${worked}</b>✅ Kaam Kiya</div>
        <div class="box"><b>${blocked}</b>❌ Block Hua</div>
        <div class="box"><b>${untested}</b>⏳ Test Nahi Hua</div>
      `;

      const categories = [...new Set(portals.map(p => p.category))];
      categories.forEach(cat => {
        const label = document.createElement('div');
        label.className = 'cat-label';
        label.textContent = cat;
        list.appendChild(label);

        portals.filter(p => p.category === cat).forEach(p => {
          const card = document.createElement('div');
          card.className = 'card' + (p.testResult?.result === 'worked' ? ' marked-yes' : p.testResult?.result === 'blocked' ? ' marked-no' : '');
          card.innerHTML = `
            <div>
              <div class="name">${p.name}</div>
              <div class="status">${p.testResult ? (p.testResult.result === 'worked' ? '✅ Kaam kiya' : '❌ Block hua') : 'Abhi test nahi hua'}</div>
            </div>
            <div class="actions">
              <button class="open" type="button" onclick="openInAppBrowser(${JSON.stringify(p.url)})">Kholo</button>
              <button class="yes" onclick="markTest('${p.id}','worked')">✅</button>
              <button class="no" onclick="markTest('${p.id}','blocked')">❌</button>
            </div>
          `;
          list.appendChild(card);
        });
      });
    }

    loadPortals();
  </script>
</body>
</html>

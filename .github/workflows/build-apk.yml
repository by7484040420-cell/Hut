                  }
                  if (u.contains("parivahan") || u.contains("sarathi")) {
                      return "Driving Licence ke liye:\n"
                          + "• Aadhaar / ID proof\n"
                          + "• Address proof\n"
                          + "• Age proof (10th marksheet ya birth certificate)\n"
                          + "• Passport photo aur Signature\n"
                          + "• Mobile (OTP ke liye)\n"
                          + "• Learner licence number (permanent DL ke liye)\n"

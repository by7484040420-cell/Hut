              // AI ko jo details chahiye (mata-pita, mobile, email, username...) user se poochne ka popup
              private void showAskDialog(final JSONArray asks, final String note) {
                  if (askOpen) return;
                  askOpen = true;
                  runOnUiThread(() -> {
                      final int pad = (int) (16 * getResources().getDisplayMetrics().density);
                      android.widget.ScrollView sv = new android.widget.ScrollView(this);
                      LinearLayout box = new LinearLayout(this);
                      box.setOrientation(LinearLayout.VERTICAL);
                      box.setPadding(pad, pad, pad, pad);
                      sv.addView(box);
                      if (note != null && !note.isEmpty()) {
                          TextView nt = new TextView(this);
                          nt.setText(note);
                          nt.setTextSize(12f);
                          box.addView(nt);
                      }
                      final java.util.ArrayList<JSONObject> items = new java.util.ArrayList<>();
                      final java.util.ArrayList<View> inputs = new java.util.ArrayList<>();
                      for (int i = 0; i < asks.length(); i++) {
                          JSONObject a = asks.optJSONObject(i);
                          if (a == null) continue;
                          TextView lbl = new TextView(this);
                          lbl.setText(a.optString("label", "Detail"));
                          lbl.setTextSize(13f);
                          lbl.setPadding(0, pad / 2, 0, 0);
                          box.addView(lbl);
                          JSONArray opts = a.optJSONArray("options");
                          View input;
                          if (opts != null && opts.length() > 0) {
                              android.widget.Spinner sp = new android.widget.Spinner(this);
                              java.util.ArrayList<String> names = new java.util.ArrayList<>();
                              names.add("-- chuno --");
                              for (int j = 0; j < opts.length(); j++) names.add(opts.optString(j));
                              sp.setAdapter(new android.widget.ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, names));
                              input = sp;
                          } else {
                              android.widget.EditText et = new android.widget.EditText(this);
                              et.setSingleLine(true);
                              String key = a.optString("key", "");
                              if ("mobile".equals(key) || "alternateMobile".equals(key)) {
                                  et.setInputType(android.text.InputType.TYPE_CLASS_PHONE);
                              } else if ("email".equals(key)) {
                                  et.setInputType(android.text.InputType.TYPE_CLASS_TEXT | android.text.InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
                              }
                              input = et;
                          }
                          box.addView(input);
                          items.add(a);
                          inputs.add(input);
                      }
                      new AlertDialog.Builder(this)
                          .setTitle("AI ko ye details chahiye")
                          .setView(sv)
                          .setCancelable(false)
                          .setPositiveButton("Bhar do", (d, w) -> submitAsks(items, inputs))
                          .setNegativeButton("Baad me", (d, w) -> askOpen = false)
                          .show();
                  });
              }

              private void submitAsks(java.util.ArrayList<JSONObject> items, java.util.ArrayList<View> inputs) {
                  try {
                      JSONObject payload = new JSONObject(activePayloadJson == null ? "{}" : activePayloadJson);
                      JSONObject direct = new JSONObject();
                      for (int i = 0; i < items.size(); i++) {
                          JSONObject a = items.get(i);
                          View v = inputs.get(i);
                          String val = "";
                          if (v instanceof android.widget.Spinner) {
                              android.widget.Spinner sp = (android.widget.Spinner) v;
                              if (sp.getSelectedItemPosition() > 0) val = String.valueOf(sp.getSelectedItem());
                          } else if (v instanceof android.widget.EditText) {
                              val = ((android.widget.EditText) v).getText().toString().trim();
                          }
                          if (val.isEmpty()) continue;
                          String key = a.optString("key", "");
                          if (!key.isEmpty()) payload.put(key, val);        // session memory: agle pages pe bhi kaam aayega
                          else direct.put(a.optString("id"), val);
                      }
                      activePayloadJson = payload.toString();
                      if (direct.length() > 0) applyAiFieldMapOnPortal(direct.toString());
                  } catch (Exception ignored) {}
                  askOpen = false;
                  scheduleTick(600);
              }

              // ---- Document upload: AI user ka document khud form me lagata hai ----
              private String[] pickDocFor(String kind) {
                  synchronized (ramDocs) {
                      for (String[] d : ramDocs) {
                          String n = d[0].toLowerCase();
                          boolean isPhoto = n.contains("photo") || n.contains("passport") || n.contains("selfie");
                          boolean isSign = n.contains("sign");
                          if ("photo".equals(kind) && isPhoto) return d;
                          if ("signature".equals(kind) && isSign) return d;
                          if ("doc".equals(kind) && !isPhoto && !isSign) return d;
                      }
                  }
                  return null;
              }

              private void attachDoc(final String id, final String[] doc) {
                  final String js = "(function(){try{var el=document.querySelector('[data-sarthi-id=\"" + id + "\"]');if(!el)return 'noel';"
                      + "var bin=atob('" + doc[2] + "');var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);"
                      + "var f=new File([u]," + JSONObject.quote(doc[0]) + ",{type:" + JSONObject.quote(doc[1]) + "});"
                      + "var dt=new DataTransfer();dt.items.add(f);el.files=dt.files;"
                      + "el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));"
                      + "return 'ok';}catch(e){return 'err:'+e;}})();";
                  runOnUiThread(() -> {
                      if (portalWebView == null) return;
                      portalWebView.evaluateJavascript(js, raw -> emitPortalEvent("Document upload: " + (raw == null ? "" : raw.replace("\"", "")) + " (" + doc[0] + ")", null));
                      scheduleTick(1500);
                  });
              }

              private void handleUploadFields(JSONArray fields) {
                  for (int i = 0; i < fields.length(); i++) {
                      JSONObject f = fields.optJSONObject(i);
                      if (f == null) continue;
                      String id = f.optString("id");
                      if (id.isEmpty() || uploadHandled.contains(id)) continue;
                      String kind = f.optString("docKind", "doc");
                      String[] doc = pickDocFor(kind);
                      if (doc != null) {
                          uploadHandled.add(id);
                          attachDoc(id, doc);
                      } else {
                          askPickDoc(id, f.optString("label", "Document"), kind);
                          return;
                      }
                  }
              }

              private void askPickDoc(final String id, final String label, final String kind) {
                  if (SILENT_FILL) {
                      uploadHandled.add(id);
                      emitPortalEvent(("photo".equals(kind) ? "Photo" : ("signature".equals(kind) ? "Signature" : "Document"))
                          + " upload: \"" + label + "\" field pe tap karke file chuno (AI ke paas ye file nahi thi)", null);
                      return;
                  }
                  if (uploadDialogOpen) return;
                  uploadDialogOpen = true;
                  final String what = "photo".equals(kind) ? "Photo" : ("signature".equals(kind) ? "Signature" : "Document");
                  runOnUiThread(() -> new AlertDialog.Builder(this)
                      .setTitle(what + " chahiye")
                      .setMessage("Form me \"" + label + "\" upload karna hai. Apne phone se file chuno, baaki AI laga dega.")
                      .setCancelable(false)
                      .setPositiveButton("File chuno", (d, w) -> {
                          uploadHandled.add(id);
                          pendingAttachId = id;
                          try { attachPicker.launch(new String[]{"*/*"}); } catch (Exception e) { uploadDialogOpen = false; }
                      })
                      .setNegativeButton("Baad me", (d, w) -> { uploadHandled.add(id); uploadDialogOpen = false; })
                      .show());
              }

              private void readAndAttach(final android.net.Uri uri, final String id) {
                  new Thread(() -> {
                      try {
                          java.io.InputStream is = getContentResolver().openInputStream(uri);
                          java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int n;
                          while (is != null && (n = is.read(buf)) > 0) bos.write(buf, 0, n);
                          if (is != null) is.close();
                          String mime = getContentResolver().getType(uri);
                          String name = uri.getLastPathSegment();
                          final String[] doc = new String[]{
                              name == null ? "document" : name,
                              mime == null ? "application/octet-stream" : mime,
                              Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)
                          };
                          synchronized (ramDocs) {
                              if (ramDocs.size() >= 6) ramDocs.remove(0);
                              ramDocs.add(doc);
                          }
                          if (id != null) attachDoc(id, doc);
                          else emitPortalEvent("Document AI ke paas aa gaya (RAM me): " + doc[0], null);
                      } catch (Exception e) {
                          emitPortalEvent("File padh nahi paya", null);
                      }
                  }).start();
              }


name: Build SarthiAI Android APK (With Ad-Blocker)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.SARTHIAI_BACKEND_URL || '' }}
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android wrapper
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SarthiAI" "com.sarthiai.assistant" --web-dir dist
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sarthiai.assistant",
            "appName": "SarthiAI",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"]
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Configure Native WebView Ad-Blocker & Non-Overlapping StatusBar in MainActivity
        shell: bash
        run: |
          MAIN_ACT="android/app/src/main/java/com/sarthiai/assistant/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACT"
          package com.sarthiai.assistant;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.ByteArrayInputStream;
          import java.util.Arrays;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final List<String> AD_HOSTS = Arrays.asList(
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                  "adservice.google.", "taboola.com", "outbrain.com", "criteo.com",
                  "pubmatic.com", "openx.net", "adnxs.com", "moatads.com",
                  "scorecardresearch.com", "amazon-adsystem.com", "popads.net",
                  "propellerads.com", "adsterra.com", "mgid.com", "revcontent.com"
              );

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Prevent Android status bar clock/icons from overlapping the SarthiAI top header
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().setStatusBarColor(Color.parseColor("#0F172A"));
                  getWindow().setNavigationBarColor(Color.parseColor("#FFFFFF"));
                  WindowInsetsControllerCompat insetsController =
                      new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  insetsController.setAppearanceLightStatusBars(false);
                  insetsController.setAppearanceLightNavigationBars(true);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebSettings settings = this.bridge.getWebView().getSettings();
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                      this.bridge.getWebView().setWebViewClient(new BridgeWebViewClient(this.bridge) {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              String url = request.getUrl() != null ? request.getUrl().toString().toLowerCase() : "";
                              for (String host : AD_HOSTS) {
                                  if (url.contains(host)) {
                                      return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream(new byte[0]));
                                  }
                              }
                              return super.shouldInterceptRequest(view, request);
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarthiai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

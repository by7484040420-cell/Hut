              // Har non-IRCTC website desktop-size layout me (zoom allowed)
              private void forceDesktopView(WebView view) {
                  if (view == null) return;
                  android.util.DisplayMetrics dm = getResources().getDisplayMetrics();
                  float sc = Math.min(1f, (dm.widthPixels / dm.density) / 1280f);
                  String scs = String.format(java.util.Locale.US, "%.4f", sc);
                  final String js = "(function(){try{var m=document.querySelector('meta[name=viewport]');"
                      + "if(!m){m=document.createElement('meta');m.name='viewport';(document.head||document.documentElement).appendChild(m);}"
                      + "m.setAttribute('content','width=1280, initial-scale=" + scs + ", minimum-scale=" + scs + ", maximum-scale=4.0, user-scalable=yes');}catch(e){}})();";
                  view.evaluateJavascript(js, null);
              }

              // IRCTC phone-sized responsive viewport: login, CAPTCHA aur ticket buttons saaf aur bade dikhein
              private void ensureMobileViewport(WebView view) {
                  if (view == null) return;
                  final String js = "(function(){try{var m=document.querySelector('meta[name=viewport]');"
                      + "if(!m){m=document.createElement('meta');m.name='viewport';(document.head||document.documentElement).appendChild(m);}"
                      + "m.setAttribute('content','width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes');}catch(e){}})();";
                  view.evaluateJavascript(js, null);
              }


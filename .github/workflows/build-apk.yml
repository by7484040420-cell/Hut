name: Build Android APK (VibeRoom)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build web bundle
        run: |
          npm install
          npm run build

      - name: Create Capacitor Android wrapper
        run: |
          mkdir -p capacitor-app/www
          cp -r dist/* capacitor-app/www/
          cat > capacitor-app/package.json << 'EOF'
          {
            "name": "viberoom-apk",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF
          cat > capacitor-app/capacitor.config.json << 'EOF'
          {
            "appId": "com.viberoom.app",
            "appName": "VibeRoom",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor & sync Android
        working-directory: ./capacitor-app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null
          set -o pipefail

      - name: Build Debug APK
        working-directory: ./capacitor-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viberoom-apk
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk

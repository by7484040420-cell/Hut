                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          try {
                              String u = request.getUrl().toString();
                              if (u.startsWith("upi://") || u.startsWith("tez://") || u.startsWith("phonepe://")
                                  || u.startsWith("paytmmp://") || u.startsWith("bhim://") || u.startsWith("gpay://")
                                  || u.startsWith("intent://")) {
                                  try {
                                      Intent intent = u.startsWith("intent://")
                                          ? Intent.parseUri(u, Intent.URI_INTENT_SCHEME)
                                          : new Intent(Intent.ACTION_VIEW, android.net.Uri.parse(u));
                                      startActivity(intent);
                                  } catch (Exception ignored2) {}
                                  return true;
                              }
                              if (request.isForMainFrame() && u.startsWith("http://")) {
                                  view.loadUrl("https://" + u.substring(7));
                                  return true;
                              }
                          } catch (Exception ignored) {}
                          return false;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, android.webkit.WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          try {
                              if (request.isForMainFrame()) {
                                  emitPortalEvent("Page khula nahi: " + error.getDescription() + " - internet check karke dobara try karein", request.getUrl().toString());
                              }
                          } catch (Exception ignored) {}
                      }

                      @Override
                      public void onReceivedSslError(WebView view, android.webkit.SslErrorHandler handler, android.net.http.SslError error) {
                          handler.cancel();   // security: certificate galat ho to kholna nahi
                          emitPortalEvent("Site ka SSL certificate galat hai - phone ki date/time sahi karo ya baad me try karo", null);
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          tickCount = 0;
                          waitTicks = 0;
                          irctcSorryDetected = false;
                          uploadHandled.clear();
                          tickHandler.removeCallbacks(tickRunnable);
                          tickHandler.removeCallbacks(irctcRunnable);
                          currentPortalUrl = url == null ? "" : url;
                          applyPortalWebSettings(view, url);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          CookieManager.getInstance().flush();          // session disk par save
                          currentPortalUrl = url == null ? "" : url;
                          forceDesktopView(view);
                          if (handleAccessDenied(view, url)) return;
                          maybeShowRequirements(url);
                          if (isIrctcUrl(url)) {
                              tickHandler.removeCallbacks(tickRunnable);
                              view.evaluateJavascript(
                                  "(function(){try{return /sorry!*\\s*please try again/i.test((document.body&&document.body.innerText)||'')?'1':'0';}catch(e){return '0';}})();",
                                  raw -> {
                                      if (raw != null && raw.contains("1")) {
                                          irctcSorryDetected = true;
                                          irctcLoginRequested = false;
                                          emitPortalEvent("IRCTC ne \"Sorry\" page dikhaya — khud \"Click here to login\" ya Close dabakar dobara kholein", url);
                                      } else {
                                          emitPortalEvent("IRCTC Desktop Ready — khud Login/Search karein, form bharne ke liye AI FILL dabayein", url);
                                      }
                                  });
                              if (loadIrctcCred() != null || irctcLoginRequested) {
                                  startIrctcWatch();
                              }
                              return;
                          }
                          emitPortalEvent("Loaded: " + url, url);
                          scheduleTick(900);
                      }
                  });

                  portalOverlay.addView(bar);
                  portalOverlay.addView(portalWebView);
                  root.addView(portalOverlay);
              }

              // "Access Denied" (Akamai) page aaye to: UA badal ke koshish (IRCTC par Android Chrome UA + cookies protect)
              private boolean handleAccessDenied(final WebView view, String url) {
                  try {
                      String t = view.getTitle();
                      if (t == null || !t.toLowerCase().contains("access denied")) return false;
                      String host = "site";
                      try { host = android.net.Uri.parse(url).getHost(); } catch (Exception ignored) {}
                      if (host == null) host = "site";
                      Integer n = deniedTries.get(host);
                      int tries = n == null ? 0 : n;
                      if (tries >= 3 || lastPortalUrl.isEmpty()) {
                          emitPortalEvent("Site ne block kiya (Access Denied). 10-15 min ruko ya Wi-Fi / mobile data badlo, phir dobara kholo", url);
                          return true;
                      }
                      deniedTries.put(host, tries + 1);
                      if (isIrctcUrl(url)) {
                          view.getSettings().setUserAgentString(tries == 0 ? getAndroidChromeUa() : UA_LIST[uaMode]);
                      } else {
                          uaMode = (uaMode + 1) % UA_LIST.length;
                          view.getSettings().setUserAgentString(UA_LIST[uaMode]);
                          CookieManager.getInstance().removeAllCookies(null);
                      }
                      view.clearCache(true);
                      emitPortalEvent("Access Denied aaya - dobara koshish " + (tries + 1) + "/3", url);
                      final String target = lastPortalUrl;
                      view.postDelayed(() -> view.loadUrl(target), 2000 + tries * 1500);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void hideImeIfIdle() {
                  try {
                      if (portalWebView == null || isIrctcCurrent()) return;
                      if (System.currentTimeMillis() - lastPortalTouchAt < 20000) return;   // user type kar raha hai
                      android.view.inputmethod.InputMethodManager imm =
                          (android.view.inputmethod.InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(portalWebView.getWindowToken(), 0);
                  } catch (Exception ignored) {}
              }

              private String loadFillEngine() {
                  try {
                      java.io.InputStream is = getAssets().open("public/sarthi-fill-engine.js");
                      java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = is.read(buf)) > 0) bos.write(buf, 0, n);
                      is.close();
                      return bos.toString("UTF-8");
                  } catch (Exception e) {
                      return null;
                  }
              }

              private String decodeJsResult(String raw) throws Exception {
                  String cleaned = raw;
                  if (cleaned != null && cleaned.startsWith("\"") && cleaned.endsWith("\"")) {
                      cleaned = new JSONObject("{\"v\":" + cleaned + "}").getString("v");
                  }
                  return cleaned;
              }

              private void emitUnmatchedFields(JSONArray unmatched, String url, String title) {
                  try {
                      JSONObject obj = new JSONObject();
                      obj.put("fields", unmatched);
                      obj.put("url", url == null ? "" : url);
                      obj.put("title", title == null ? "" : title);
                      final String script =
                          "window.onSarthiNativeUnmatched && window.onSarthiNativeUnmatched("
                          + JSONObject.quote(obj.toString()) + ");";
                      runOnUiThread(() -> {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(script, null);
                          }
                      });

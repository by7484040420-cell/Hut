name: Build Sarthi Narad AI Android APK (AI Fill Engine + AI Field Mapper + ML Kit OCR + Ad-Blocker)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Deployed SarthiAI Backend Server URL'
        required: false
        default: 'https://hut-3igh.onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.backend_url || vars.SARTHIAI_BACKEND_URL || 'https://hut-3igh.onrender.com' }}
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android wrapper
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sarthi Narad AI" "com.sarthiai.assistant" --web-dir dist
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sarthiai.assistant",
            "appName": "Sarthi Narad AI",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"]
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Add On-Device ML Kit OCR & AndroidX WebKit to Gradle
        shell: python3 {0}
        run: |
          from pathlib import Path
          gradle_path = Path("android/app/build.gradle")
          text = gradle_path.read_text(encoding="utf-8")
          deps = (
              "    implementation 'com.google.mlkit:text-recognition:16.0.1'\n"
              "    implementation 'androidx.webkit:webkit:1.12.1'\n"
          )
          if "com.google.mlkit:text-recognition" not in text:
              target = "dependencies {"
              assert target in text, "dependencies block not found in android/app/build.gradle"
              text = text.replace(target, target + "\n" + deps, 1)
              gradle_path.write_text(text, encoding="utf-8")

      - name: Configure Native AI-Controlled WebView, ML Kit OCR, Ad-Blocker & Readable StatusBar
        shell: bash
        run: |
          STYLES_XML="android/app/src/main/res/values/styles.xml"
          cat << 'EOF' > "$STYLES_XML"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#0F172A</item>
                  <item name="colorPrimaryDark">#F8FAFC</item>
                  <item name="colorAccent">#E11D48</item>
                  <item name="android:statusBarColor">#F8FAFC</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme" />
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme" />
          </resources>
          EOF

          MAIN_ACT="android/app/src/main/java/com/sarthiai/assistant/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACT"
          package com.sarthiai.assistant;

          import android.app.AlertDialog;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          import java.io.ByteArrayInputStream;
          import java.util.Arrays;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private static final List<String> AD_HOSTS = Arrays.asList(
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                  "adservice.google.", "taboola.com", "outbrain.com", "criteo.com",
                  "pubmatic.com", "openx.net", "adnxs.com", "moatads.com",
                  "scorecardresearch.com", "amazon-adsystem.com", "popads.net",
                  "propellerads.com", "adsterra.com", "mgid.com", "revcontent.com"
              );

              private static final String DESKTOP_UA =
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  + "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36";

              private LinearLayout portalOverlay;
              private WebView portalWebView;
              private int tickCount = 0;
              private boolean askOpen = false;
              private boolean resetAsk = false;
              private boolean formDone = false;
              private android.webkit.ValueCallback<android.net.Uri[]> fileCallback;
              private final androidx.activity.result.ActivityResultLauncher<String[]> filePicker =
                  registerForActivityResult(new androidx.activity.result.contract.ActivityResultContracts.OpenDocument(), uri -> {
                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(uri == null ? null : new android.net.Uri[]{uri});
                          fileCallback = null;
                      }
                  });
              private final android.os.Handler tickHandler = new android.os.Handler(android.os.Looper.getMainLooper());
              private final Runnable tickRunnable = () -> runAutoFillOnPortal();

              private void scheduleTick(long delayMs) {
                  tickHandler.removeCallbacks(tickRunnable);
                  tickHandler.postDelayed(tickRunnable, delayMs);
              }
              private TextView portalStatusView;
              private String activePayloadJson = "{}";
              private TextRecognizer textRecognizer;

              private void applySystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().setStatusBarColor(Color.parseColor("#F8FAFC"));
                  getWindow().setNavigationBarColor(Color.parseColor("#FFFFFF"));
                  WindowInsetsControllerCompat insetsController =
                      new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  insetsController.setAppearanceLightStatusBars(true);
                  insetsController.setAppearanceLightNavigationBars(true);
              }

              private boolean isAdRequest(WebResourceRequest request) {
                  String url = request.getUrl() != null ? request.getUrl().toString().toLowerCase() : "";
                  for (String host : AD_HOSTS) {
                      if (url.contains(host)) return true;
                  }
                  return false;
              }

              private void emitPortalEvent(String message, String url) {
                  try {
                      JSONObject obj = new JSONObject();
                      obj.put("message", message);
                      if (url != null) obj.put("url", url);
                      final String script =
                          "window.onSarthiNativePortalEvent && window.onSarthiNativePortalEvent("
                          + JSONObject.quote(obj.toString()) + ");";
                      runOnUiThread(() -> {
                          if (portalStatusView != null) {
                              portalStatusView.setText(message);
                          }
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(script, null);
                          }
                      });
                  } catch (Exception ignored) {}
              }

              private void ensurePortalOverlay() {
                  if (portalOverlay != null) return;

                  FrameLayout root = findViewById(android.R.id.content);
                  portalOverlay = new LinearLayout(this);
                  portalOverlay.setOrientation(LinearLayout.VERTICAL);
                  portalOverlay.setBackgroundColor(Color.parseColor("#0F172A"));
                  portalOverlay.setVisibility(View.GONE);
                  portalOverlay.setLayoutParams(new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setBackgroundColor(Color.parseColor("#0F172A"));
                  int pad = (int) (8 * getResources().getDisplayMetrics().density);
                  bar.setPadding(pad, pad, pad, pad);

                  Button backBtn = new Button(this);
                  backBtn.setText("< Back");
                  backBtn.setTextSize(11f);
                  backBtn.setTextColor(Color.WHITE);
                  backBtn.setBackgroundColor(Color.parseColor("#1E293B"));
                  backBtn.setOnClickListener(v -> {
                      if (portalWebView != null && portalWebView.canGoBack()) {
                          portalWebView.goBack();
                      } else {
                          portalOverlay.setVisibility(View.GONE);
                      }
                  });

                  portalStatusView = new TextView(this);
                  portalStatusView.setText("SarthiAI WebView Ready");
                  portalStatusView.setTextColor(Color.parseColor("#E2E8F0"));
                  portalStatusView.setTextSize(11f);
                  portalStatusView.setSingleLine(true);
                  LinearLayout.LayoutParams statusParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f
                  );
                  statusParams.setMargins(pad, 0, pad, 0);
                  portalStatusView.setLayoutParams(statusParams);

                  Button fillBtn = new Button(this);
                  fillBtn.setText("AI Fill");
                  fillBtn.setTextSize(11f);
                  fillBtn.setTextColor(Color.WHITE);
                  fillBtn.setBackgroundColor(Color.parseColor("#059669"));
                  fillBtn.setOnClickListener(v -> { tickCount = 0; resetAsk = true; runAutoFillOnPortal(); });

                  Button closeBtn = new Button(this);
                  closeBtn.setText("Close");
                  closeBtn.setTextSize(11f);
                  closeBtn.setTextColor(Color.WHITE);
                  closeBtn.setBackgroundColor(Color.parseColor("#E11D48"));
                  LinearLayout.LayoutParams closeParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  closeParams.setMargins(pad / 2, 0, 0, 0);
                  closeBtn.setLayoutParams(closeParams);
                  closeBtn.setOnClickListener(v -> {
                      if (formDone) {
                          formDone = false;
                          if (portalWebView != null) {
                              portalWebView.clearCache(true);
                              portalWebView.clearHistory();
                              portalWebView.loadUrl("about:blank");
                          }
                          CookieManager.getInstance().removeAllCookies(null);
                          WebStorage.getInstance().deleteAllData();
                      }
                      if (portalOverlay != null) portalOverlay.setVisibility(View.GONE);
                  });

                  bar.addView(backBtn);
                  bar.addView(portalStatusView);
                  bar.addView(fillBtn);
                  bar.addView(closeBtn);

                  portalWebView = new WebView(this);
                  portalWebView.setLayoutParams(new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ));
                  WebSettings ps = portalWebView.getSettings();
                  ps.setJavaScriptEnabled(true);
                  ps.setDomStorageEnabled(true);
                  ps.setDatabaseEnabled(true);
                  ps.setUseWideViewPort(true);
                  ps.setLoadWithOverviewMode(true);
                  ps.setSupportZoom(true);
                  ps.setBuiltInZoomControls(true);
                  ps.setDisplayZoomControls(false);
                  ps.setUserAgentString(DESKTOP_UA);
                  ps.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(portalWebView, true);

                  portalWebView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, android.webkit.ValueCallback<android.net.Uri[]> cb, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          try {
                              filePicker.launch(new String[]{"*/*"});
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  portalWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          if (isAdRequest(request)) {
                              return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream(new byte[0]));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          tickCount = 0;
                          tickHandler.removeCallbacks(tickRunnable);
                          forceDesktopView(view);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          forceDesktopView(view);
                          emitPortalEvent("Loaded: " + url, url);
                          scheduleTick(900);
                      }
                  });

                  portalOverlay.addView(bar);
                  portalOverlay.addView(portalWebView);
                  root.addView(portalOverlay);
              }

              private String loadFillEngine() {
                  try {
                      java.io.InputStream is = getAssets().open("public/sarthi-fill-engine.js");
                      java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = is.read(buf)) > 0) bos.write(buf, 0, n);
                      is.close();
                      return bos.toString("UTF-8");
                  } catch (Exception e) {
                      return null;
                  }
              }

              private String decodeJsResult(String raw) throws Exception {
                  String cleaned = raw;
                  if (cleaned != null && cleaned.startsWith("\"") && cleaned.endsWith("\"")) {
                      cleaned = new JSONObject("{\"v\":" + cleaned + "}").getString("v");
                  }
                  return cleaned;
              }

              private void emitUnmatchedFields(JSONArray unmatched, String url, String title) {
                  try {
                      JSONObject obj = new JSONObject();
                      obj.put("fields", unmatched);
                      obj.put("url", url == null ? "" : url);
                      obj.put("title", title == null ? "" : title);
                      final String script =
                          "window.onSarthiNativeUnmatched && window.onSarthiNativeUnmatched("
                          + JSONObject.quote(obj.toString()) + ");";
                      runOnUiThread(() -> {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(script, null);
                          }
                      });
                  } catch (Exception ignored) {}
              }

              // Har website desktop-size layout me (viewport 1280px force)
              private void forceDesktopView(WebView view) {
                  if (view == null) return;
                  final String js = "(function(){try{var m=document.querySelector('meta[name=viewport]');"
                      + "if(!m){m=document.createElement('meta');m.name='viewport';(document.head||document.documentElement).appendChild(m);}"
                      + "m.setAttribute('content','width=1280');}catch(e){}})();";
                  view.evaluateJavascript(js, null);
              }

              private void handleFormDone() {
                  activePayloadJson = "{}";
                  formDone = true;
                  tickHandler.removeCallbacks(tickRunnable);
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null) {
                          bridge.getWebView().evaluateJavascript(
                              "window.onSarthiNativeFormDone && window.onSarthiNativeFormDone();", null);
                      }
                  });
              }

              // AI ko jo details chahiye (mata-pita, mobile, email, username...) user se poochne ka popup
              private void showAskDialog(final JSONArray asks) {
                  if (askOpen) return;
                  askOpen = true;
                  runOnUiThread(() -> {
                      final int pad = (int) (16 * getResources().getDisplayMetrics().density);
                      android.widget.ScrollView sv = new android.widget.ScrollView(this);
                      LinearLayout box = new LinearLayout(this);
                      box.setOrientation(LinearLayout.VERTICAL);
                      box.setPadding(pad, pad, pad, pad);
                      sv.addView(box);
                      final java.util.ArrayList<JSONObject> items = new java.util.ArrayList<>();
                      final java.util.ArrayList<View> inputs = new java.util.ArrayList<>();
                      for (int i = 0; i < asks.length(); i++) {
                          JSONObject a = asks.optJSONObject(i);
                          if (a == null) continue;
                          TextView lbl = new TextView(this);
                          lbl.setText(a.optString("label", "Detail"));
                          lbl.setTextSize(13f);
                          lbl.setPadding(0, pad / 2, 0, 0);
                          box.addView(lbl);
                          JSONArray opts = a.optJSONArray("options");
                          View input;
                          if (opts != null && opts.length() > 0) {
                              android.widget.Spinner sp = new android.widget.Spinner(this);
                              java.util.ArrayList<String> names = new java.util.ArrayList<>();
                              names.add("-- chuno --");
                              for (int j = 0; j < opts.length(); j++) names.add(opts.optString(j));
                              sp.setAdapter(new android.widget.ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, names));
                              input = sp;
                          } else {
                              android.widget.EditText et = new android.widget.EditText(this);
                              et.setSingleLine(true);
                              String key = a.optString("key", "");
                              if ("mobile".equals(key) || "alternateMobile".equals(key)) {
                                  et.setInputType(android.text.InputType.TYPE_CLASS_PHONE);
                              } else if ("email".equals(key)) {
                                  et.setInputType(android.text.InputType.TYPE_CLASS_TEXT | android.text.InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
                              }
                              input = et;
                          }
                          box.addView(input);
                          items.add(a);
                          inputs.add(input);
                      }
                      new AlertDialog.Builder(this)
                          .setTitle("AI ko ye details chahiye")
                          .setView(sv)
                          .setCancelable(false)
                          .setPositiveButton("Bhar do", (d, w) -> submitAsks(items, inputs))
                          .setNegativeButton("Baad me", (d, w) -> askOpen = false)
                          .show();
                  });
              }

              private void submitAsks(java.util.ArrayList<JSONObject> items, java.util.ArrayList<View> inputs) {
                  try {
                      JSONObject payload = new JSONObject(activePayloadJson == null ? "{}" : activePayloadJson);
                      JSONObject direct = new JSONObject();
                      for (int i = 0; i < items.size(); i++) {
                          JSONObject a = items.get(i);
                          View v = inputs.get(i);
                          String val = "";
                          if (v instanceof android.widget.Spinner) {
                              android.widget.Spinner sp = (android.widget.Spinner) v;
                              if (sp.getSelectedItemPosition() > 0) val = String.valueOf(sp.getSelectedItem());
                          } else if (v instanceof android.widget.EditText) {
                              val = ((android.widget.EditText) v).getText().toString().trim();
                          }
                          if (val.isEmpty()) continue;
                          String key = a.optString("key", "");
                          if (!key.isEmpty()) payload.put(key, val);        // session memory: agle pages pe bhi kaam aayega
                          else direct.put(a.optString("id"), val);
                      }
                      activePayloadJson = payload.toString();
                      if (direct.length() > 0) applyAiFieldMapOnPortal(direct.toString());
                  } catch (Exception ignored) {}
                  askOpen = false;
                  scheduleTick(600);
              }

              private void runAutoFillOnPortal() {
                  if (portalWebView == null) return;
                  final String engine = loadFillEngine();
                  if (engine == null) {
                      emitPortalEvent("Fill engine load nahi hua (sarthi-fill-engine.js missing)", null);
                      return;
                  }
                  final String payload = activePayloadJson == null ? "{}" : activePayloadJson;
                  final boolean rs = resetAsk;
                  resetAsk = false;
                  final String js = engine
                      + "\n;(function(){try{"
                      + "var p=JSON.parse(" + JSONObject.quote(payload) + ");"
                      + "var r=window.SarthiFill.autopilot(p,{reset:" + (rs ? "true" : "false") + "});"
                      + "window.SarthiFill.watch(p);"
                      + "return JSON.stringify(r);"
                      + "}catch(e){return JSON.stringify({error:String(e)});}})();";

                  runOnUiThread(() -> portalWebView.evaluateJavascript(js, raw -> {
                      try {
                          JSONObject res = new JSONObject(decodeJsResult(raw));
                          if (res.has("error")) {
                              emitPortalEvent("Fill engine error: " + res.optString("error"), null);
                              return;
                          }
                          int filled = res.optInt("filled", 0);
                          String url = res.optString("url", "");
                          StringBuilder msg = new StringBuilder("AI Auto-Fill: " + filled + " fields bhare");
                          if (res.optBoolean("hasCaptcha", false)) msg.append(" | CAPTCHA aap dalein");
                          if (res.optBoolean("hasOtp", false)) msg.append(" | OTP aap dalein");
                          if (res.optBoolean("hasPassword", false)) msg.append(" | Password aap dalein");
                          if (res.optBoolean("hasPayment", false)) msg.append(" | Payment/Bank details aap dalein");
                          int decl = res.optInt("declarations", 0);
                          if (decl > 0) msg.append(" | Terms/Declaration tick kiya (" + decl + ")");
                          JSONArray need = res.optJSONArray("needsUser");
                          if (need != null && need.length() > 0) msg.append(" | Vault me kami: " + need.join(", ").replace("\"", ""));
                          JSONArray unmatched = res.optJSONArray("unmatched");
                          if (unmatched != null && unmatched.length() > 0) {
                              msg.append(" | " + unmatched.length() + " fields AI se map ho rahe hain...");
                              emitUnmatchedFields(unmatched, url, res.optString("title", ""));
                          }
                          String st = res.optString("state", "");
                          if ("next".equals(st)) msg.append(" | Aage badh gaya: " + res.optString("clicked"));
                          else if ("final".equals(st)) msg.append(" | Next button nahi mila - aap check karke Submit karein");
                          JSONArray ups = res.optJSONArray("uploads");
                          if (ups != null && ups.length() > 0) msg.append(" | Document upload karo (field pe tap karke file chuno): " + ups.join(", ").replace("\"", ""));
                          if (res.optBoolean("done", false)) {
                              emitPortalEvent("Form complete - chat aur documents saaf. Receipt save karke CLOSE dabao", url);
                              handleFormDone();
                              return;
                          }
                          emitPortalEvent(msg.toString(), url);
                          JSONArray asks = res.optJSONArray("asks");
                          if (asks != null && asks.length() > 0) showAskDialog(asks);
                          if (tickCount++ < 40) scheduleTick(3000);
                      } catch (Exception ignored) {
                          emitPortalEvent("AI WebView active", null);
                      }
                  }));
              }

              private void applyAiFieldMapOnPortal(String mapJson) {
                  if (portalWebView == null) return;
                  final String js = "(function(){try{"
                      + "var m=JSON.parse(" + JSONObject.quote(mapJson == null ? "{}" : mapJson) + ");"
                      + "return JSON.stringify(window.SarthiFill?window.SarthiFill.applyMap(m):{filled:0});"
                      + "}catch(e){return JSON.stringify({error:String(e)});}})();";
                  runOnUiThread(() -> portalWebView.evaluateJavascript(js, raw -> {
                      try {
                          JSONObject res = new JSONObject(decodeJsResult(raw));
                          emitPortalEvent("AI ne " + res.optInt("filled", 0) + " aur fields bhare (blue highlight) - ek baar check kar lein", null);
                      } catch (Exception ignored) {
                          emitPortalEvent("AI field map apply ho gaya", null);
                      }
                  }));
              }

              private void parseAndSendOcrResult(String requestId, String rawText) {
                  try {
                      JSONArray fields = new JSONArray();
                      String upper = rawText.toUpperCase();
                      String docType = "Scanned Document (On-Device ML Kit)";

                      Matcher panMatcher = Pattern.compile("\\b([A-Z]{5}[0-9]{4}[A-Z])\\b").matcher(upper);
                      if (panMatcher.find()) {
                          docType = "PAN Card (On-Device OCR)";
                          fields.put(new JSONObject().put("key", "pan_number").put("label", "PAN Number").put("value", panMatcher.group(1)));
                      }

                      Matcher aadhaarMatcher = Pattern.compile("\\b([2-9][0-9]{3}[\\s-]?[0-9]{4}[\\s-]?[0-9]{4})\\b").matcher(rawText);
                      if (aadhaarMatcher.find()) {
                          docType = "Aadhaar Card (On-Device OCR)";
                          fields.put(new JSONObject().put("key", "aadhaar_number").put("label", "Aadhaar Number").put("value", aadhaarMatcher.group(1)));
                      }

                      Matcher dobMatcher = Pattern.compile("\\b(\\d{2}[\\/\\-]\\d{2}[\\/\\-]\\d{4})\\b").matcher(rawText);
                      if (dobMatcher.find()) {
                          fields.put(new JSONObject().put("key", "dob").put("label", "Date of Birth").put("value", dobMatcher.group(1)));
                      }

                      Matcher mobileMatcher = Pattern.compile("\\b([6-9][0-9]{9})\\b").matcher(rawText);
                      if (mobileMatcher.find()) {
                          fields.put(new JSONObject().put("key", "mobile").put("label", "Mobile Number").put("value", mobileMatcher.group(1)));
                      }

                      Matcher pinMatcher = Pattern.compile("\\b([1-9][0-9]{5})\\b").matcher(rawText);
                      if (pinMatcher.find()) {
                          fields.put(new JSONObject().put("key", "pin_code").put("label", "PIN Code").put("value", pinMatcher.group(1)));
                      }

                      if (upper.contains("FEMALE")) {
                          fields.put(new JSONObject().put("key", "gender").put("label", "Gender").put("value", "Female"));
                      } else if (upper.contains("MALE")) {
                          fields.put(new JSONObject().put("key", "gender").put("label", "Gender").put("value", "Male"));
                      }

                      String[] lines = rawText.split("\\r?\\n");
                      for (int i = 0; i < lines.length; i++) {
                          String line = lines[i].trim();
                          String lLow = line.toLowerCase();
                          if ((lLow.contains("s/o") || lLow.contains("d/o") || lLow.contains("w/o") || lLow.contains("father")) && line.length() > 5) {
                              fields.put(new JSONObject().put("key", "father_name").put("label", "Father's Name").put("value", line.replaceAll("(?i).*(s/o|d/o|w/o|father'?s? name)[:\\s-]*", "").trim()));
                          } else if (i > 0 && i < 6 && line.matches("^[A-Za-z][A-Za-z .]{3,35}$")
                              && !lLow.contains("government") && !lLow.contains("india") && !lLow.contains("income tax") && !lLow.contains("department")) {
                              fields.put(new JSONObject().put("key", "full_name").put("label", "Full Name").put("value", line));
                              break;
                          }
                      }

                      JSONObject out = new JSONObject();
                      out.put("ok", true);
                      out.put("documentType", docType);
                      out.put("rawText", rawText);
                      out.put("fields", fields);

                      final String js = "window.onSarthiNativeOcrResult && window.onSarthiNativeOcrResult("
                          + JSONObject.quote(requestId) + ", " + JSONObject.quote(out.toString()) + ");";
                      runOnUiThread(() -> {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(js, null);
                          }
                      });
                  } catch (Exception e) {
                      sendOcrError(requestId);
                  }
              }

              private void sendOcrError(String requestId) {
                  try {
                      JSONObject out = new JSONObject();
                      out.put("ok", false);
                      final String js = "window.onSarthiNativeOcrResult && window.onSarthiNativeOcrResult("
                          + JSONObject.quote(requestId) + ", " + JSONObject.quote(out.toString()) + ");";
                      runOnUiThread(() -> {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(js, null);
                          }
                      });
                  } catch (Exception ignored) {}
              }

              public class SarthiNativeBridge {
                  @JavascriptInterface
                  public boolean isNativeApk() {
                      return true;
                  }

                  @JavascriptInterface
                  public void openPortal(String url, String payloadJson) {
                      activePayloadJson = payloadJson != null ? payloadJson : "{}";
                      runOnUiThread(() -> {
                          ensurePortalOverlay();
                          portalOverlay.setVisibility(View.VISIBLE);
                          portalOverlay.bringToFront();
                          portalStatusView.setText("Opening: " + url);
                          portalWebView.loadUrl(url);
                      });
                  }

                  @JavascriptInterface
                  public void autoFillPortal(String payloadJson) {
                      if (payloadJson != null) activePayloadJson = payloadJson;
                      runOnUiThread(() -> runAutoFillOnPortal());
                  }

                  @JavascriptInterface
                  public void applyAiFieldMap(String mapJson) {
                      applyAiFieldMapOnPortal(mapJson);
                  }

                  @JavascriptInterface
                  public void closePortal() {
                      runOnUiThread(() -> {
                          if (portalOverlay != null) portalOverlay.setVisibility(View.GONE);
                      });
                  }

                  @JavascriptInterface
                  public void wipePortalSession() {
                      activePayloadJson = "{}";
                      runOnUiThread(() -> {
                          if (portalWebView != null) {
                              portalWebView.clearCache(true);
                              portalWebView.clearHistory();
                              portalWebView.loadUrl("about:blank");
                          }
                          CookieManager.getInstance().removeAllCookies(null);
                          WebStorage.getInstance().deleteAllData();
                          emitPortalEvent("Zero-Save Session Wiped", "about:blank");
                      });
                  }

                  @JavascriptInterface
                  public void scanDocumentOcr(String base64Image, String requestId) {
                      try {
                          byte[] decoded = Base64.decode(base64Image, Base64.DEFAULT);
                          Bitmap bmp = BitmapFactory.decodeByteArray(decoded, 0, decoded.length);
                          if (bmp == null) {
                              sendOcrError(requestId);
                              return;
                          }
                          if (textRecognizer == null) {
                              textRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                          }
                          InputImage image = InputImage.fromBitmap(bmp, 0);
                          textRecognizer.process(image)
                              .addOnSuccessListener(visionText -> parseAndSendOcrResult(requestId, visionText.getText()))
                              .addOnFailureListener(e -> sendOcrError(requestId));
                      } catch (Exception e) {
                          sendOcrError(requestId);
                      }
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applySystemBars();

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView mainWv = this.bridge.getWebView();
                      WebSettings settings = mainWv.getSettings();
                      settings.setUseWideViewPort(true);
                      settings.setLoadWithOverviewMode(true);
                      settings.setSupportZoom(true);
                      settings.setBuiltInZoomControls(true);
                      settings.setDisplayZoomControls(false);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                      mainWv.addJavascriptInterface(new SarthiNativeBridge(), "SarthiNative");
                      mainWv.setWebViewClient(new BridgeWebViewClient(this.bridge) {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              if (isAdRequest(request)) {
                                  return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream(new byte[0]));
                              }
                              return super.shouldInterceptRequest(view, request);
                          }
                      });
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  applySystemBars();
              }

              @Override
              public void onBackPressed() {
                  if (portalOverlay != null && portalOverlay.getVisibility() == View.VISIBLE) {
                      if (portalWebView != null && portalWebView.canGoBack()) {
                          portalWebView.goBack();
                      } else {
                          portalOverlay.setVisibility(View.GONE);
                      }
                      return;
                  }
                  super.onBackPressed();
              }
          }

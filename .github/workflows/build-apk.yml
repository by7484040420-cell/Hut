name: Build Android APK (BIPIN AI)

# Sab fixes is file mein already hain:
# 1. capacitor-app folder pehle banaya jaata hai (pehla bug fix)
# 2. Sahi package: @capgo/capacitor-inappbrowser (galat naam fix)
# 3. Sab dependencies "latest" (version-mismatch fix)
# 4. Render URL: hut-3igh.onrender.com (updated URL)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: Node.js setup karo
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java setup karo
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: capacitor-app folder banao
        run: mkdir -p capacitor-app

      - name: package.json banao
        run: |
          cat > capacitor-app/package.json << 'EOF'
          {
            "name": "bipin-ai-app",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "latest",
              "@capacitor/android": "latest",
              "@capgo/capacitor-inappbrowser": "latest"
            },
            "devDependencies": {
              "@capacitor/cli": "latest"
            }
          }
          EOF

      - name: Capacitor config banao
        run: |
          cat > capacitor-app/capacitor.config.json << 'EOF'
          {
            "appId": "com.bipinai.app",
            "appName": "BIPIN AI",
            "webDir": "www",
            "server": {
              "url": "https://hut-3igh.onrender.com",
              "cleartext": false
            }
          }
          EOF

      - name: Website files www folder mein copy karo
        run: |
          mkdir -p capacitor-app/www
          cp public/app-shell.html capacitor-app/www/index.html

      - name: Capacitor install karo
        run: npm install
        working-directory: ./capacitor-app

      - name: Android platform add karo
        run: npx cap add android
        working-directory: ./capacitor-app

      - name: Capacitor sync karo
        run: npx cap sync android
        working-directory: ./capacitor-app

      - name: Android SDK setup karo
        uses: android-actions/setup-android@v3

      - name: APK build karo
        run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ./capacitor-app/android

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: bipin-ai-app
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk

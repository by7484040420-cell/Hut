name: Build Sarthi Narad AI Android APK (AI Fill Engine + AI Field Mapper + ML Kit OCR + Ad-Blocker)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Deployed SarthiAI Backend Server URL'
        required: false
        default: 'https://hut-3igh.onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.backend_url || vars.SARTHIAI_BACKEND_URL || 'https://hut-3igh.onrender.com' }}
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android wrapper
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sarthi Narad AI" "com.sarthiai.assistant" --web-dir dist
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sarthiai.assistant",
            "appName": "Sarthi Narad AI",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"]
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Add On-Device ML Kit OCR & AndroidX WebKit to Gradle
        shell: python3 {0}
        run: |
          from pathlib import Path
          gradle_path = Path("android/app/build.gradle")
          text = gradle_path.read_text(encoding="utf-8")
          deps = (
              "    implementation 'com.google.mlkit:text-recognition:16.0.1'\n"
              "    implementation 'androidx.webkit:webkit:1.12.1'\n"
          )
          if "com.google.mlkit:text-recognition" not in text:
              target = "dependencies {"
              assert target in text, "dependencies block not found in android/app/build.gradle"
              text = text.replace(target, target + "\n" + deps, 1)
              gradle_path.write_text(text, encoding="utf-8")

      - name: Configure Native AI-Controlled WebView, ML Kit OCR, Ad-Blocker & Readable StatusBar
        shell: bash
        run: |
          STYLES_XML="android/app/src/main/res/values/styles.xml"
          cat << 'EOF' > "$STYLES_XML"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#0F172A</item>
                  <item name="colorPrimaryDark">#F8FAFC</item>
                  <item name="colorAccent">#E11D48</item>
                  <item name="android:statusBarColor">#F8FAFC</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme" />
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme" />
          </resources>
          EOF

          MAIN_ACT="android/app/src/main/java/com/sarthiai/assistant/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACT"
          package com.sarthiai.assistant;

          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import androidx.webkit.WebSettingsCompat;
          import androidx.webkit.WebViewFeature;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          import java.io.ByteArrayInputStream;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private static final List<String> AD_HOSTS = Arrays.asList(
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                  "adservice.google.", "taboola.com", "outbrain.com", "criteo.com",
                  "pubmatic.com", "openx.net", "adnxs.com", "moatads.com",
                  "scorecardresearch.com", "amazon-adsystem.com", "popads.net",
                  "propellerads.com", "adsterra.com", "mgid.com", "revcontent.com"
              );

              private static final String DESKTOP_UA =
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  + "(KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36";

              // Access Denied (Akamai) aaye to ye UA ek-ek karke try hote hain
              private static final String[] UA_LIST = {
                  DESKTOP_UA,
                  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36",
                  "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36"
              };
              private int uaMode = 0;
              private String androidChromeUa = null;
              private String lastPortalUrl = "";
              private final java.util.HashMap<String, Integer> deniedTries = new java.util.HashMap<>();

              private LinearLayout portalOverlay;
              private WebView portalWebView;
              private Button portalLoginBtn;
              private int tickCount = 0;
              private int waitTicks = 0;   // OTP/CAPTCHA ke intezaar me alag ginti (taaki baad me bhi AI chale)
              // true = website khulne ke baad koi popup nahi: details pehle hi li jaati hain, baaki status line me dikhta hai
              private static final boolean SILENT_FILL = true;
              private boolean askOpen = false;
              private boolean resetAsk = false;
              private boolean formDone = false;
              private final java.util.ArrayList<String[]> ramDocs = new java.util.ArrayList<>();   // {name, mime, base64} sirf RAM me
              private final java.util.HashSet<String> uploadHandled = new java.util.HashSet<>();
              private final java.util.HashSet<String> reqShown = new java.util.HashSet<>();
              private boolean uploadDialogOpen = false;
              private String pendingAttachId = null;
              private final androidx.activity.result.ActivityResultLauncher<String[]> attachPicker =
                  registerForActivityResult(new androidx.activity.result.contract.ActivityResultContracts.OpenDocument(), uri -> {
                      final String id = pendingAttachId;
                      pendingAttachId = null;
                      uploadDialogOpen = false;
                      if (uri != null) readAndAttach(uri, id);
                  });
              private android.webkit.ValueCallback<android.net.Uri[]> fileCallback;
              private final androidx.activity.result.ActivityResultLauncher<String[]> filePicker =
                  registerForActivityResult(new androidx.activity.result.contract.ActivityResultContracts.OpenDocument(), uri -> {
                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(uri == null ? null : new android.net.Uri[]{uri});
                          fileCallback = null;
                      }
                  });
              private final android.os.Handler tickHandler = new android.os.Handler(android.os.Looper.getMainLooper());
              private final Runnable tickRunnable = () -> runAutoFillOnPortal();

              private void scheduleTick(long delayMs) {
                  tickHandler.removeCallbacks(tickRunnable);
                  tickHandler.postDelayed(tickRunnable, delayMs);
              }
              private TextView portalStatusView;
              private volatile long lastPortalTouchAt = 0;   // user ne portal ko akhri baar kab chhua (keyboard sirf tab khule)
              private String activePayloadJson = "{}";
              private TextRecognizer textRecognizer;

              private void applySystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().setStatusBarColor(Color.parseColor("#F8FAFC"));
                  getWindow().setNavigationBarColor(Color.parseColor("#FFFFFF"));
                  WindowInsetsControllerCompat insetsController =
                      new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  insetsController.setAppearanceLightStatusBars(true);
                  insetsController.setAppearanceLightNavigationBars(true);
              }

              private boolean isAdRequest(WebResourceRequest request) {
                  String url = request.getUrl() != null ? request.getUrl().toString().toLowerCase() : "";
                  if (url.contains("irctc") || (lastPortalUrl != null && lastPortalUrl.contains("irctc"))) {
                      return false;   // IRCTC par koi script/analytics block nahi — real browser jaise chale
                  }
                  for (String host : AD_HOSTS) {
                      if (url.contains(host)) return true;
                  }
                  return false;
              }

              private void emitPortalEvent(String message, String url) {
                  emitPortalEvent(null, message, url);
              }

              private void emitPortalEvent(String eventType, String message, String url) {
                  try {
                      JSONObject obj = new JSONObject();
                      if (eventType != null) obj.put("event", eventType);
                      obj.put("message", message);
                      if (url != null) obj.put("url", url);
                      final String script =
                          "window.onSarthiNativePortalEvent && window.onSarthiNativePortalEvent("
                          + JSONObject.quote(obj.toString()) + ");";
                      runOnUiThread(() -> {
                          if (portalStatusView != null) {
                              portalStatusView.setText(message);
                          }
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(script, null);
                          }
                      });
                  } catch (Exception ignored) {}
              }

              private String getAndroidChromeUa() {
                  if (androidChromeUa == null) {
                      try {
                          String def = WebSettings.getDefaultUserAgent(this);
                          androidChromeUa = def
                              .replace("; wv)", ")")
                              .replace("; wv;", ";")
                              .replaceAll("Version/[0-9.]+\\s*", "")
                              .replaceAll("\\s{2,}", " ");
                      } catch (Exception e) {
                          androidChromeUa = UA_LIST[2];
                      }
                  }
                  return androidChromeUa;
              }

              private void applyPortalWebSettings(WebView view, String url) {
                  if (view == null) return;
                  WebSettings ps = view.getSettings();
                  ps.setSupportZoom(true);
                  ps.setBuiltInZoomControls(true);
                  ps.setDisplayZoomControls(false);
                  boolean isIrctc = isIrctcUrl(url);
                  if (portalLoginBtn != null) {
                      final boolean showLogin = isIrctc;
                      runOnUiThread(() -> {
                          if (portalLoginBtn != null) {
                              portalLoginBtn.setVisibility(showLogin ? View.VISIBLE : View.GONE);
                          }
                      });
                  }
                  if (isIrctc) {
                      // Use genuine phone Chrome UA so TLS + Client-Hints match phone during Tatkal rush
                      ps.setUserAgentString(getAndroidChromeUa());
                  } else {
                      ps.setUserAgentString(UA_LIST[uaMode]);
                  }
                  try {
                      if (WebViewFeature.isFeatureSupported(WebViewFeature.REQUESTED_WITH_HEADER_ALLOW_LIST)) {
                          WebSettingsCompat.setRequestedWithHeaderOriginAllowList(ps, Collections.emptySet());
                      }
                  } catch (Throwable ignored) {}
              }

              // ===== IRCTC: session bachao + login ek baar save =====
              private static final String[] IRCTC_JUNK = {
                  "google-analytics.com", "googletagmanager.com", "facebook.net", "facebook.com/tr",
                  "hotjar.com", "clarity.ms", "connect.facebook"
              };
              private static final String KS_ALIAS = "sarthi_cred_key";
              private volatile String currentPortalUrl = "";
              private volatile boolean irctcSorryDetected = false;
              private volatile boolean irctcLoginRequested = false;
              private String cachedIrctcHelper = null;
              private String[] irctcStaged = null;          // login click par RAM me; login SAFAL hone par hi save
              private boolean irctcFilledThisModal = false;
              private final Runnable irctcRunnable = () -> irctcTick();

              private static boolean isIrctcUrl(String u) {
                  if (u == null) return false;
                  try {
                      String h = android.net.Uri.parse(u).getHost();
                      return h != null && (h.equals("irctc.co.in") || h.endsWith(".irctc.co.in"));
                  } catch (Exception e) { return false; }
              }

              private boolean irctcBlockedPage() {
                  if (irctcSorryDetected) return true;
                  try {
                      String t = portalWebView == null ? null : portalWebView.getTitle();
                      if (t == null) return false;
                      t = t.toLowerCase();
                      return t.contains("access denied") || t.contains("unavailable") || t.contains("sorry");
                  } catch (Exception e) { return false; }
              }

              // IRCTC ka SAHI (error nahi) page khula ho tabhi true
              private boolean irctcActive() {
                  return portalWebView != null && isIrctcUrl(portalWebView.getUrl()) && !irctcBlockedPage();
              }

              private boolean isIrctcCurrent() {
                  return irctcActive()
                      || isIrctcUrl(currentPortalUrl)
                      || (portalWebView != null && isIrctcUrl(portalWebView.getUrl()));
              }

              private javax.crypto.SecretKey credKey() throws Exception {
                  java.security.KeyStore ks = java.security.KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (!ks.containsAlias(KS_ALIAS)) {
                      javax.crypto.KeyGenerator kg = javax.crypto.KeyGenerator.getInstance("AES", "AndroidKeyStore");
                      kg.init(new android.security.keystore.KeyGenParameterSpec.Builder(
                              KS_ALIAS,
                              android.security.keystore.KeyProperties.PURPOSE_ENCRYPT | android.security.keystore.KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(android.security.keystore.KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(android.security.keystore.KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build());
                      return kg.generateKey();
                  }
                  return ((java.security.KeyStore.SecretKeyEntry) ks.getEntry(KS_ALIAS, null)).getSecretKey();
              }

              private void saveIrctcCred(String user, String pass) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("u", user);
                      o.put("p", pass);
                      javax.crypto.Cipher c = javax.crypto.Cipher.getInstance("AES/GCM/NoPadding");
                      c.init(javax.crypto.Cipher.ENCRYPT_MODE, credKey());
                      byte[] iv = c.getIV();
                      byte[] ct = c.doFinal(o.toString().getBytes("UTF-8"));
                      String blob = Base64.encodeToString(iv, Base64.NO_WRAP) + ":" + Base64.encodeToString(ct, Base64.NO_WRAP);
                      getSharedPreferences("sarthi_cred", MODE_PRIVATE).edit().putString("irctc", blob).apply();
                  } catch (Exception ignored) {}
              }

              private String[] loadIrctcCred() {
                  try {
                      String blob = getSharedPreferences("sarthi_cred", MODE_PRIVATE).getString("irctc", null);
                      if (blob == null) return null;
                      String[] parts = blob.split(":");
                      javax.crypto.Cipher c = javax.crypto.Cipher.getInstance("AES/GCM/NoPadding");
                      c.init(javax.crypto.Cipher.DECRYPT_MODE, credKey(),
                          new javax.crypto.spec.GCMParameterSpec(128, Base64.decode(parts[0], Base64.NO_WRAP)));
                      JSONObject o = new JSONObject(new String(c.doFinal(Base64.decode(parts[1], Base64.NO_WRAP)), "UTF-8"));
                      return new String[]{o.getString("u"), o.getString("p")};
                  } catch (Exception e) { return null; }
              }

              private void clearIrctcCred() {
                  try { getSharedPreferences("sarthi_cred", MODE_PRIVATE).edit().remove("irctc").apply(); } catch (Exception ignored) {}
              }

              private String loadAssetText(String path) {
                  try {
                      java.io.InputStream is = getAssets().open(path);
                      java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = is.read(buf)) > 0) bos.write(buf, 0, n);
                      is.close();
                      return bos.toString("UTF-8");
                  } catch (Exception e) { return null; }
              }

              private void startIrctcWatch() {
                  tickHandler.removeCallbacks(irctcRunnable);
                  tickHandler.postDelayed(irctcRunnable, 1200);
              }

              private void irctcTick() {
                  try {
                      if (portalWebView == null || portalOverlay == null || portalOverlay.getVisibility() != View.VISIBLE) return;
                      String cu = portalWebView.getUrl();
                      currentPortalUrl = cu == null ? "" : cu;
                      if (!isIrctcUrl(cu)) return;                       // IRCTC se bahar gaye -> watch band
                      if (!irctcLoginRequested && loadIrctcCred() == null && irctcStaged == null) return;
                      if (cachedIrctcHelper == null) {
                          cachedIrctcHelper = loadAssetText("public/irctc-helper.js");
                      }
                      final String helper = cachedIrctcHelper;
                      if (helper != null) {
                          portalWebView.evaluateJavascript(helper + "\n;SarthiIrctc.status();", raw -> {
                              String st = "";
                              try { st = decodeJsResult(raw); } catch (Exception ignored) {}
                              if ("sorry".equals(st)) {
                                  irctcSorryDetected = true;
                                  irctcFilledThisModal = false;
                                  irctcLoginRequested = false;
                                  return;
                              } else if ("ready".equals(st)) {
                                  irctcSorryDetected = false;
                                  portalWebView.evaluateJavascript("SarthiIrctc.hook();", null);
                                  if (!irctcFilledThisModal) {
                                      String[] c = loadIrctcCred();
                                      if (c != null) {
                                          irctcFilledThisModal = true;
                                          portalWebView.evaluateJavascript(
                                              "SarthiIrctc.fill(" + JSONObject.quote(c[0]) + "," + JSONObject.quote(c[1]) + ");", null);
                                          emitPortalEvent("IRCTC: saved user id/password bhar diya - CAPTCHA aap daalo aur SIGN IN dabao", currentPortalUrl);
                                      }
                                  }
                              } else if ("error".equals(st)) {
                                  irctcSorryDetected = false;
                                  if (irctcFilledThisModal) {
                                      clearIrctcCred();                         // galat save tha -> hata diya, dobara auto-try nahi
                                      emitPortalEvent("IRCTC: user id/password galat. Purana save hata diya - sahi wala khud daalo, login ke baad apne aap save hoga", currentPortalUrl);
                                  }
                                  irctcFilledThisModal = true;                  // error ke baad refill nahi
                              } else if ("loggedin".equals(st)) {
                                  irctcSorryDetected = false;
                                  if (irctcStaged != null) {
                                      saveIrctcCred(irctcStaged[0], irctcStaged[1]);
                                      irctcStaged = null;
                                      emitPortalEvent("IRCTC login safal - user id/password hamesha ke liye save ho gaya", currentPortalUrl);
                                  }
                                  irctcFilledThisModal = false;
                                  irctcLoginRequested = false;
                                  return;
                              } else {
                                  irctcSorryDetected = false;
                                  irctcFilledThisModal = false;
                              }
                              if (portalOverlay != null && portalOverlay.getVisibility() == View.VISIBLE
                                      && isIrctcUrl(currentPortalUrl)
                                      && (irctcLoginRequested || loadIrctcCred() != null || irctcStaged != null)) {
                                  tickHandler.postDelayed(irctcRunnable, 2800);
                              }
                          });
                      }
                  } catch (Exception ignored) {}
              }

              public class IrctcCredBridge {
                  @JavascriptInterface
                  public void stage(String u, String p) {              // sirf likhta hai, padhne ka koi tareeka nahi
                      if (!isIrctcUrl(currentPortalUrl)) return;
                      if (u == null || p == null || u.isEmpty() || p.isEmpty()) return;
                      irctcStaged = new String[]{u, p};
                  }
              }

              private void ensurePortalOverlay() {
                  if (portalOverlay != null) return;

                  FrameLayout root = findViewById(android.R.id.content);
                  portalOverlay = new LinearLayout(this);
                  portalOverlay.setOrientation(LinearLayout.VERTICAL);
                  portalOverlay.setBackgroundColor(Color.parseColor("#0F172A"));
                  portalOverlay.setVisibility(View.GONE);
                  portalOverlay.setLayoutParams(new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setBackgroundColor(Color.parseColor("#0F172A"));
                  int pad = (int) (8 * getResources().getDisplayMetrics().density);
                  bar.setPadding(pad, pad, pad, pad);

                  int btnPadX = (int) (10 * getResources().getDisplayMetrics().density);
                  int btnPadY = (int) (6 * getResources().getDisplayMetrics().density);

                  Button backBtn = new Button(this);
                  backBtn.setText("< Back");
                  backBtn.setTextSize(11f);
                  backBtn.setTextColor(Color.WHITE);
                  backBtn.setBackgroundColor(Color.parseColor("#1E293B"));
                  backBtn.setMinWidth(0);
                  backBtn.setMinimumWidth(0);
                  backBtn.setPadding(btnPadX, btnPadY, btnPadX, btnPadY);
                  backBtn.setOnClickListener(v -> {
                      if (isIrctcCurrent()) {
                          // IRCTC me Back = "Sorry! Please try again". Isliye sirf app screen par wapas, session zinda rehta hai
                          portalOverlay.setVisibility(View.GONE);
                      } else if (portalWebView != null && portalWebView.canGoBack()) {
                          portalWebView.goBack();
                      } else {
                          portalOverlay.setVisibility(View.GONE);
                      }
                  });

                  portalStatusView = new TextView(this);
                  portalStatusView.setText("SarthiAI WebView Ready");
                  portalStatusView.setTextColor(Color.parseColor("#E2E8F0"));
                  portalStatusView.setTextSize(11f);
                  portalStatusView.setSingleLine(true);
                  LinearLayout.LayoutParams statusParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f
                  );
                  statusParams.setMargins(pad, 0, pad, 0);
                  portalStatusView.setLayoutParams(statusParams);

                  portalLoginBtn = new Button(this);
                  portalLoginBtn.setText("Login");
                  portalLoginBtn.setTextSize(11f);
                  portalLoginBtn.setTextColor(Color.WHITE);
                  portalLoginBtn.setBackgroundColor(Color.parseColor("#0284C7"));
                  portalLoginBtn.setMinWidth(0);
                  portalLoginBtn.setMinimumWidth(0);
                  portalLoginBtn.setPadding(btnPadX, btnPadY, btnPadX, btnPadY);
                  portalLoginBtn.setVisibility(isIrctcUrl(lastPortalUrl) ? View.VISIBLE : View.GONE);
                  LinearLayout.LayoutParams loginParams = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  loginParams.setMargins(0, 0, pad / 2, 0);
                  portalLoginBtn.setLayoutParams(loginParams);
                  portalLoginBtn.setOnClickListener(v -> {
                      if (portalWebView == null) return;
                      irctcLoginRequested = true;
                      if (cachedIrctcHelper == null) {
                          cachedIrctcHelper = loadAssetText("public/irctc-helper.js");
                      }
                      final String h = cachedIrctcHelper == null ? "" : cachedIrctcHelper;
                      portalWebView.evaluateJavascript(
                          h + "\n;(function(){return window.SarthiIrctc?window.SarthiIrctc.openLogin():'no_helper';})();",
                          raw -> {
                              String r = "";
                              try { r = decodeJsResult(raw); } catch (Exception ignored) {}
                              if ("loggedin".equals(r)) {
                                  irctcLoginRequested = false;
                                  emitPortalEvent("IRCTC account pehle se login hai", currentPortalUrl);
                              } else {
                                  emitPortalEvent("IRCTC Login khul raha hai — CAPTCHA daal kar SIGN IN karein", currentPortalUrl);
                                  irctcFilledThisModal = false;
                                  startIrctcWatch();
                              }
                          }
                      );
                  });

                  Button fillBtn = new Button(this);
                  fillBtn.setText("AI Fill");
                  fillBtn.setTextSize(11f);
                  fillBtn.setTextColor(Color.WHITE);
                  fillBtn.setBackgroundColor(Color.parseColor("#059669"));
                  fillBtn.setMinWidth(0);
                  fillBtn.setMinimumWidth(0);
                  fillBtn.setPadding(btnPadX, btnPadY, btnPadX, btnPadY);
                  fillBtn.setOnClickListener(v -> { tickCount = 0; waitTicks = 0; resetAsk = true; runAutoFillOnPortal(); });

                  Button closeBtn = new Button(this);
                  closeBtn.setText("Close");
                  closeBtn.setTextSize(11f);
                  closeBtn.setTextColor(Color.WHITE);
                  closeBtn.setBackgroundColor(Color.parseColor("#E11D48"));
                  closeBtn.setMinWidth(0);
                  closeBtn.setMinimumWidth(0);
                  closeBtn.setPadding(btnPadX, btnPadY, btnPadX, btnPadY);
                  LinearLayout.LayoutParams closeParams = new LinearLayout.LayoutParams(

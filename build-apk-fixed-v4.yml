name: Build Android APK (BIPIN AI)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: Node.js 22 setup karo
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 setup karo
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: capacitor-app folder banao
        run: mkdir -p capacitor-app

      - name: package.json banao
        run: |
          cat > capacitor-app/package.json << 'EOF'
          {
            "name": "bipin-ai-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capgo/capacitor-inappbrowser": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

      - name: Capacitor config banao
        run: |
          cat > capacitor-app/capacitor.config.json << 'EOF'
          {
            "appId": "com.bipinai.app",
            "appName": "BIPIN AI",
            "webDir": "www",
            "server": {
              "url": "https://hut-3igh.onrender.com",
              "cleartext": false
            }
          }
          EOF

      - name: Website files www folder mein copy karo
        run: |
          mkdir -p capacitor-app/www
          cp public/app-shell.html capacitor-app/www/index.html

      - name: Capacitor install karo
        run: npm install
        working-directory: ./capacitor-app

      - name: Android platform add karo
        run: npx cap add android
        working-directory: ./capacitor-app

      - name: Capacitor sync karo
        run: npx cap sync android
        working-directory: ./capacitor-app

      - name: Android SDK setup karo
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Required Android SDK packages install karo
        shell: bash
        run: |
          set -e
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Android SDK licenses accept karo
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null
          set -o pipefail

      - name: APK build karo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
        working-directory: ./capacitor-app/android

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: bipin-ai-app
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
